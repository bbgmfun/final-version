name: CI/CD — Build, push to ACR & deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }} # e.g. acrse4458bb1.azurecr.io
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ secrets.AZURE_LOCATION }}
      TAG: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push images
        run: |
          set -euo pipefail
          IMAGES=("iam-service" "hotel-service" "comments-service" "notification-service" "ai-agent-service" "api-gateway" "frontend")
          for img in "${IMAGES[@]}"; do
            echo "Building $img"
            docker build -t $ACR_LOGIN_SERVER/$img:${TAG} ./$img
            docker push $ACR_LOGIN_SERVER/$img:${TAG}
          done

      - name: Deploy to Container Apps
        run: |
          set -euo pipefail
          # Update each container app to the new image tag
          az containerapp update --name iam-service --resource-group $RESOURCE_GROUP --image $ACR_LOGIN_SERVER/iam-service:${TAG}
          az containerapp update --name hotel-service --resource-group $RESOURCE_GROUP --image $ACR_LOGIN_SERVER/hotel-service:${TAG}
          az containerapp update --name comments-service --resource-group $RESOURCE_GROUP --image $ACR_LOGIN_SERVER/comments-service:${TAG}
          az containerapp update --name notification-service --resource-group $RESOURCE_GROUP --image $ACR_LOGIN_SERVER/notification-service:${TAG}
          az containerapp update --name ai-agent-service --resource-group $RESOURCE_GROUP --image $ACR_LOGIN_SERVER/ai-agent-service:${TAG}
          az containerapp update --name api-gateway --resource-group $RESOURCE_GROUP --image $ACR_LOGIN_SERVER/api-gateway:${TAG}
          az containerapp update --name frontend --resource-group $RESOURCE_GROUP --image $ACR_LOGIN_SERVER/frontend:${TAG}

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
